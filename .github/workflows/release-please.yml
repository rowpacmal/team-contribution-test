# Keeps a release PR open (version bump + CHANGELOG.md). Merging it tags and
# creates the GitHub Release. See CONTRIBUTING.md Part 4.
name: Release Please

on:
  push:
    branches: [main, "release/**"]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # GITHUB_TOKEN can't trigger other workflows (CI on the release PR,
          # release.yml on the tag). Set RELEASE_PLEASE_TOKEN (GitHub App token) for that.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: ${{ github.ref_name }}
